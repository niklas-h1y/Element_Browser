<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>DOM Inspector Pro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 290px;
      padding: 12px;
      margin: 0;
      background-color: #f6f8fa;
      color: #24292f;
    }
    h3 { margin: 0 0 8px 0; font-size: 14px; }
    
    .inspect-panel {
      background: #24292f;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 10px;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }

    .category {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #24292f;
      margin: 12px 0 6px 0;
      background: #eaeef2;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .input-group label { font-size: 12px; }
    .input-group input[type="text"] {
      width: 140px;
      padding: 4px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-size: 12px;
    }

    .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .2s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: #2da44e; }
    input:checked + .slider:before { transform: translateX(14px); }

    .action-btn {
      width: 100%;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    #picker-btn { background-color: #0969da; }
    #picker-btn.active { background-color: #cf222e; }
    #apply-btn { background-color: #2da44e; display: none; }
    #delete-btn { background-color: #cf222e; display: none; }
  </style>
</head>
<body>
  <h3>DOM Element Inspector</h3>
  
  <button class="action-btn" id="picker-btn">🎯 Element auswählen</button>
  
  <div class="category">Gewähltes Element</div>
  <div id="target-info" class="inspect-panel">Kein Element gewählt. Tippe auf den Button oben!</div>

  <div id="modifier-controls" style="display: none;">
    <!-- STYLE MODERATION -->
    <div class="category">UI & Style verändern</div>
    <div class="input-group">
      <label>Display-Modus</label>
      <input type="text" id="style-display" placeholder="z.B. none, block">
    </div>
    <div class="input-group">
      <label>Deckkraft (0.0 - 1.0)</label>
      <input type="text" id="style-opacity" placeholder="1.0">
    </div>
    <div class="input-group">
      <label>Hintergrundfarbe</label>
      <input type="text" id="style-bg" placeholder="red, transparent">
    </div>

    <!-- SONDERFUNKTION FÜR IFRAMES -->
    <div id="iframe-sandbox-section" style="display: none;">
      <div class="category">iFrame Sicherheitsflags</div>
      <div class="input-group">
        <label>Scripts erlauben</label>
        <label class="switch"><input type="checkbox" id="allow-scripts"><span class="slider"></span></label>
      </div>
      <div class="input-group">
        <label>Same-Origin erlauben</label>
        <label class="switch"><input type="checkbox" id="allow-same-origin"><span class="slider"></span></label>
      </div>
    </div>

    <button class="action-btn" id="apply-btn">⚡ Änderungen anwenden</button>
    <button class="action-btn" id="delete-btn">🗑️ Element komplett löschen</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
